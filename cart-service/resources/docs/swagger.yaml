paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user
      operationId: Login
      parameters:
      - description: Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/transport.Request-domain_LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: '#/definitions/transport.Response-domain_LoginResponse'
      summary: Login
      tags:
      - auth
  /auth/validate:
    post:
      consumes:
      - application/json
      description: Validate JWT token
      operationId: ValidateJWT
      parameters:
      - description: Request
        in: body
        name: request
        required: true
