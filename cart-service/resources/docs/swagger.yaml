  /products/{productId}/comments:
    get:
      description: Get comments for a product
      operationId: GetComments
      parameters:
      - description: Product ID
        in: path
        name: productId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: '#/definitions/transport.Response-array_domain_Comment'
      summary: GetComments
      tags:
      - comment
    post:
      consumes:
      - application/json
      description: Add a comment to a product
      operationId: AddComment
      parameters:
      - description: Request
        in: body
        name: request
        required: true
