paths:
  /is/v1/cart-service/add:
    post:
      consumes:
      - application/json
      description: Insert into cart values ...
      operationId: AddCartItem
      parameters:
      - description: Request
        in: body
        name: request
        schema:
          $ref: '#/definitions/transport.Request-handlers_AddCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            $ref: '#/definitions/transport.Response-handlers_AddCartItemResposne'
      summary: AddCartItem
      tags:
      - CART SERVICE
  /is/v1/cart-service/delete:
    post:
      consumes:
      - application/json
      description: DELETE FROM cart WHERE userID = ?;
      operationId: DeleteCartItem
      parameters:
      - description: Request
        in: body
        name: request
        schema:
          $ref: '#/definitions/transport.Request-handlers_DeleteCartItemRequest'
      produces:
