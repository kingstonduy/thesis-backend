      summary: DeleteCartItem
      tags:
      - CART SERVICE
  /is/v1/cart-service/get-items:
    post:
      consumes:
      - application/json
      description: select * from cart where userID = :1
      operationId: GetCart
      parameters:
      - description: Request
        in: body
        name: request
        schema:
          $ref: '#/definitions/transport.Request-handlers_GetCartRequest'
      produces:
