      summary: GetCart
      tags:
      - CART SERVICE
  /is/v1/cart-service/update:
    post:
      consumes:
      - application/json
      description: Update the quantity of an item in the cart. front end receives
        ok returns then update StateQuantity
      operationId: UpdateCartItem
      parameters:
